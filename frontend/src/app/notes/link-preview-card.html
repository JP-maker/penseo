@if (preview(); as p) {
  <a class="card" [href]="p.url" target="_blank" rel="noopener noreferrer">
    @if (p.image) {
      <img [src]="p.image" alt="" loading="lazy" referrerpolicy="no-referrer" />
    }
    <div class="text">
      <strong>{{ p.title ?? host() }}</strong>
      @if (p.description) {
        <span>{{ p.description }}</span>
      }
      <small>{{ host() }}</small>
    </div>
  </a>
}
